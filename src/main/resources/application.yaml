spring:
  application:
    name: ms-account
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

core-banking:
  base-url: http://localhost:3001

cache:
  ttl:
    account-balance: 5m # Time To Live de los registros en Redis

resilience4j:
  circuitbreaker:
    instances:
      coreBankingCbRetry:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
  retry:
    metrics:
      enabled: true # habilita métricas de retry para visualizar por actuator
      legacy: true
    instances:
      coreBankingCbRetry:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
  timelimiter:
    metrics:
      enabled: true
    instances:
      coreBankingTl:
        timeout-duration: 3s
        cancel-running-future: true
  ratelimiter:
    instances:
      backendService: # nombre lógico del RateLimiter
        limit-for-period: 2 # número máximo de llamadas permitidas por periodo
        limit-refresh-period: 50s # duración del periodo (ej: 1 segundo)
        timeout-duration: 2s # cuánto esperar para adquirir un permiso
        registerHealthIndicator: true # expone estado en actuator/health

management:
  health:
    redis:
      enabled: true
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, circuitbreakerevents, retryevents, timelimiters

server:
  port: 9092

logging:
  level:
    io.github.resilience4j.ratelimiter: DEBUG
    io.github.resilience4j.timelimiter: DEBUG